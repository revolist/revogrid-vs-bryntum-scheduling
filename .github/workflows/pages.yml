name: Test and deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://benchmark.rv-grid.com/revogrid-vs-bryntum-scheduling/
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out scheduler review samples
        uses: actions/checkout@v4
        with:
          repository: revolist/revogrid-scheduler-review-samples
          path: .sources/revogrid-scheduler-review-samples

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .sources/revogrid-scheduler-review-samples/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@revolist'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Install scheduler review dependencies
        run: pnpm --dir .sources/revogrid-scheduler-review-samples install --frozen-lockfile --ignore-workspace
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build scheduler review samples
        run: pnpm --dir .sources/revogrid-scheduler-review-samples build
        env:
          VITE_BASE_PATH: /revogrid-scheduler-review-samples/

      - name: Add scheduler review to benchmark site
        run: |
          mkdir -p dist/revogrid-scheduler-review-samples
          cp -R .sources/revogrid-scheduler-review-samples/dist/. dist/revogrid-scheduler-review-samples/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
